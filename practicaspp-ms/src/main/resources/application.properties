#Nombre de la application
spring.application.name=practicaspp-ms
# Configuración de base de datos
spring.datasource.url=jdbc:postgresql://localhost:5433/ppp
spring.datasource.username=fourkodika
spring.datasource.password=*practicas123@*
# Configuración Hikari
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
# Logs de SQL y formateo
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Política de creación de tablas
spring.jpa.hibernate.ddl-auto=update
# Contexto base de la aplicación monolítica
server.servlet.context-path=/practicaspp
server.port=8080