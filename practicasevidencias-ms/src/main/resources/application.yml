spring:
  datasource:
    username: ${pems.username}
    hikari:
      maximum-pool-size: ${pems.maximum-pool-size}
      connection-timeout: ${pems.connection-timeout}
    url: ${pems.url}
    password: ${pems.password}
    driver-class-name: org.postgresql.Driver

  application:
    name: practicasevidencias-ms

  profiles:
    default: default

  config:
    import: "optional:configserver:${CONFIG_SERVER_HOST}"
    #import: "optional:configserver:http://localhost:7777"

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

server:
  servlet:
    context-path: /practicasevidencias-ms
  port: 0

eureka:
  instance:
    instance-id: "${spring.application.name}:${random.value}"
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/