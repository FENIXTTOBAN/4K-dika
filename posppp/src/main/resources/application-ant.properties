# SERVER
server.port=8081
server.servlet.context-path=/postulaciones

# SPRING
spring.application.name=posppp

spring.datasource.url=jdbc:postgresql://localhost:5433/ppp
spring.datasource.username=fourkodika
spring.datasource.password=*practicas123@*
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# EUREKA (DESACTIVADO)
eureka.client.enabled=false

# LOGGING
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
