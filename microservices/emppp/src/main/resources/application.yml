spring:
  application:
    name: emppp
  datasource:
    hikari:
      connection-timeout: '20000'
      maximum-pool-size: '5'
    password: '*practicas123@*'
    username: fourkodika
    url: jdbc:postgresql://localhost:5433/ppp
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: 'true'
    properties:
      hibernate:
        format_sql: 'true'
    database-platform: org.hibernate.dialect.PostgreSQLDialect
logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
        SQL: DEBUG
server:
  servlet:
    context-path: /empresas
  port: '0'

eureka:
  instance:
    instance-id: "${spring.application.name}:${random.value}"
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
